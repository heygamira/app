[project]
name = "gamira-backend"
version = "0.1.0"
description = "Authoritative API for the Gamira Parent App, Family Dashboard and website"
requires-python = ">=3.12"

[tool.ruff]
line-length = 90
target-version = "py312"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = [
    # FastAPI dependency defaults are function calls in argument position.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["RUF012"]
"tests/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = []
packages = ["app"]
exclude = ["alembic/versions"]
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]
